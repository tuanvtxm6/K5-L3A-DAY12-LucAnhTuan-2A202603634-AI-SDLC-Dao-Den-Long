<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng</title>
  <style>
    :root { --amber: #ffb347; --ink: #2a1838; --text: #fff4e0; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; padding: 10px 14px; background: rgba(20, 10, 30, .6); border: 1px solid rgba(255, 179, 71, .35); border-radius: 10px; font-size: 15px; line-height: 1.6; min-width: 210px; user-select: none; }
    #hud:empty { display: none; }
    #hud b { color: var(--amber); }
    .pip { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; background: #3b2a4a; }
    .pip.on { background: radial-gradient(circle at 40% 35%, #fff2b0, var(--amber) 60%, #c25b00); box-shadow: 0 0 6px var(--amber); }
    #hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 8px; background: rgba(20, 10, 30, .7); font-size: 15px; display: none; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 4, 16, .72); }
    #overlay .card { max-width: 460px; margin: 16px; padding: 24px 28px; text-align: center; background: rgba(30, 16, 44, .92); border: 1px solid rgba(255, 179, 71, .4); border-radius: 14px; }
    #overlay h1 { margin: 0 0 6px; color: var(--amber); font-size: 30px; }
    #overlay p { margin: 8px 0; }
    #overlay kbd { padding: 1px 6px; border-radius: 4px; background: #3b2a4a; font-family: inherit; }
    #overlay .go { margin-top: 16px; color: var(--amber); font-weight: 600; }
  </style>
  <script type="importmap">{ "imports": { "three": "/three/three.module.min.js" } }</script>
</head>
<body>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
